name: Preencher issues resolvidas no PR de release

on:
  pull_request:
    types: [opened, synchronize]
    branches: [master]

permissions:
  pull-requests: write

jobs:
  fill-body:
    if: github.event.pull_request.merged != true
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Extrair issues dos commits do PR
        id: issues
        run: |
          numbers=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json commits \
            --jq '.commits[] | (.messageHeadline + " " + .messageBody)' \
            | grep -oiE '(close|closes|closed|fix|fixes|fixed|resolve|resolves|resolved)[[:space:]]+#[0-9]+' \
            | grep -oE '[0-9]+' | sort -un)
          {
            echo "list<<EOF"
            echo "$numbers"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Atualizar body do PR com a lista de issues
        if: steps.issues.outputs.list != ''
        run: |
          block=$'<!-- issues:start -->\n'
          for n in ${{ steps.issues.outputs.list }}; do
            block+="Resolves #$n"$'\n'
          done
          block+='<!-- issues:end -->'

          current_body=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json body --jq .body)

          if echo "$current_body" | grep -q '<!-- issues:start -->'; then
            new_body=$(echo "$current_body" | awk -v block="$block" '
              BEGIN{printing=1}
              /<!-- issues:start -->/{print block; printing=0; next}
              /<!-- issues:end -->/{printing=1; next}
              printing{print}
            ')
          else
            new_body="${current_body}"$'\n\n'"${block}"
          fi

          gh pr edit "$PR_NUMBER" --repo "$REPO" --body "$new_body"
