name: Deploy API to EC2

on:
  release:
    types: [published]

jobs:
  build-and-push:
    if: github.event.release.prerelease == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/pedrobellezia/gad-api:latest
            ghcr.io/pedrobellezia/gad-api:${{ github.event.release.tag_name }}

      - name: Build and push DB Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.db
          push: true
          tags: |
            ghcr.io/pedrobellezia/gad-db:latest
            ghcr.io/pedrobellezia/gad-db:${{ github.event.release.tag_name }}

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 10m
          script: |
            cd ~/gad-api
            docker compose pull
            docker compose up -d
            docker compose exec -T api uv run alembic upgrade head
            docker image prune -f
