[project]
name = "fastapiproject"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.11"
dependencies = [
    "aiofiles>=25.1.0",
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "dotenv>=0.9.9",
    "fastapi>=0.136.1",
    "pwdlib[argon2]>=0.3.0",
    "pydantic[email]>=2.13.2",
    "pyjwt>=2.12.1",
    "pymysql>=1.1.3",
    "pytest-asyncio>=1.3.0",
    "python-magic>=0.4.27",
    "python-multipart>=0.0.29",
    "sqlalchemy>=2.0.49",
    "uvicorn>=0.46.0",
]

[dependency-groups]
dev = [
    "ruff>=0.15.12",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
]

[tool.ruff.lint.per-file-ignores]
"app/models/*.py" = ["F821"]

[tool.ruff]
exclude = [
    "alembic/env.py",
]


[tool.pytest.ini_options]
anyio_mode = "auto"
